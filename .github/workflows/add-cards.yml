concurrency:
  group: add-cards
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 準備（Playwright と Pillow を入れる）
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: 公式サイトからカードを取得
        id: fetch
        working-directory: Card_data_make
        env:
          TARGET: ${{ inputs.target }}
        run: python get_card.py "$TARGET"

      - name: cards-data.js を更新
        working-directory: Card_data_make
        run: python update_cards_data.py

      - name: コミットしてPush
        id: push
        env:
          TARGET: ${{ inputs.target }}
          SERIES: ${{ steps.fetch.outputs.series }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images cards-data.js Card_data_make/cards_data
          if git diff --cached --quiet; then
            echo "変更はありませんでした。"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "カード追加: ${SERIES:-$TARGET}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # Actions からのPushではサイトの更新が自動で始まらないので、ここで公開する
  deploy:
    needs: fetch
    if: needs.fetch.outputs.pushed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
